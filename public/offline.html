<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nutmeg — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #000000;
      color: #F7E7CE;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .card {
      background: rgba(247, 231, 206, 0.05);
      border: 1px solid rgba(247, 231, 206, 0.15);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 0 60px rgba(247, 231, 206, 0.06);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 28px;
      border-radius: 50%;
      border: 3px solid #F7E7CE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 24px;
      color: #F7E7CE;
      box-shadow: 0 0 30px rgba(247, 231, 206, 0.15);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(247, 231, 206, 0.7);
      margin-bottom: 32px;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #F7E7CE;
      color: #000000;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">N</div>
    <h1>You're offline</h1>
    <p>Nutmeg is offline right now. Check your internet connection and try again — your training plan is waiting.</p>
    <a href="/" id="retry">Check your connection</a>
  </div>
  <script>
    // Auto-retry every 5 seconds once online
    const retry = document.getElementById('retry');
    function checkOnline() {
      if (navigator.onLine) {
        location.reload();
      }
    }
    window.addEventListener('online', checkOnline);
    retry.addEventListener('click', checkOnline);
  </script>
</body>
</html>
